<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetPurple | Contato</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div class="nome"><span class="n1">Pet</span><span class="n2">Purple</span></div>
        <nav>
            <ul>
                <li><a href="index.html" class="link-menu">Home</a></li>
                <li><a href="index.html#sobre" class="link-menu">Sobre</a></li>
                <li><a href="servicos.html" class="link-menu">Serviços</a></li>
                <li><a href="contato.html" class="link-menu">Contato</a></li>
            </ul>
        </nav>

        <button class="botao-login">Login</button>
    </header>
    <!-- aula 13 - Finalizando Site (Contato) -->
    <main>
        <h1 class="titulo">Contato</h1>
        <h2 class="sub-titulo">Fale com a gente</h2>

        <form class="form-contato" onsubmit="enviarContato(event)">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">

            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem" required></textarea>

            <button type="submit" class="agenda">Enviar pelo WhatsApp</button>
        </form>

        <div class="info-contato">
            <p><strong>Telefone:</strong> (55) 98867-0677</p>
            <p><strong>Endereço:</strong> Rua dos Pets, 123 - Centro</p>
            <p><strong>Horário:</strong> Segunda a sábado, das 8h às 18h</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 PetPurple. Todos os direitos reservados.</p>
    </footer>

    <script src="app.js"></script>
</body>

</html>
